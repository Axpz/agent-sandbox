# Private integration example, not a production configuration.
# Build/load the API image; load a compatible Router image or replace its value.
development:
  allowUnauthenticated: true
  skipKubernetesTLSVerify: false
api:
  image: sandbox-api:xsphere-dev
router:
  image: sandbox-router:xsphere-dev
# Reuse the existing pool. To create one, explicitly set runtime.enabled=true,
# runtime.image and the correct workspace mount path for that image.
runtime:
  enabled: false
