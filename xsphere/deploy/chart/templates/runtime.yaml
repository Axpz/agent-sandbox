{{- if .Values.runtime.enabled }}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ .Values.runtime.templateName }}
  namespace: {{ include "xsphere.workloadNamespace" . }}
  labels:
    {{- include "xsphere.labels" . | nindent 4 }}
spec:
  envVarsInjectionPolicy: Allowed
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      automountServiceAccountToken: false
      # Keep lifecycle transitions under the sandbox controller's control.
      restartPolicy: Never
      {{- include "xsphere.nodeSettings" . | nindent 6 }}
      {{- with .Values.runtime.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: runtime
          image: {{ .Values.runtime.image | quote }}
          imagePullPolicy: IfNotPresent
          # The API returns the bound Sandbox/Pod name, including warm adoption.
          # Inject it before daemon startup so preview tools inherit the identity.
          env:
            - name: AGENTSPHERE_SANDBOX_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The postStart exec gets current Pod metadata, even though restored
            # application processes retain their checkpointed environment.
            - name: AGENTSPHERE_RESTORE_PATH
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['dev.gvisor.internal.restore.host-image-path']
          ports:
            - {name: envd, containerPort: 49983}
          # A TCP-level probe would pass even when envd's accept loop is
          # wedged (the kernel/netstack completes the handshake without any
          # application involvement), which is exactly the failure mode this
          # guards against — both probes must hit envd's own /health.
          startupProbe:
            httpGet: {path: /health, port: envd}
            periodSeconds: {{ .Values.runtime.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.runtime.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet: {path: /health, port: envd}
            periodSeconds: 2
            failureThreshold: 3
          # Restored envd can retain a stale netpoller. Restart only envd on
          # restore; restarting the container would discard application memory.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ -n "${AGENTSPHERE_RESTORE_PATH:-}" ]; then
                        pkill -x envd || true
                    fi
                    exec /usr/local/bin/envd-recover
          # s3fs mounts the user bucket from inside the sandbox, and mount(2)
          # is denied without CAP_SYS_ADMIN even for root.
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.runtime.workspace.mountPath | quote }}
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        storageClassName: {{ .Values.runtime.workspace.storageClass | quote }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.runtime.workspace.size | quote }}
  volumeClaimTemplatesPolicy: Disallowed
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ .Values.api.warmPool }}
  namespace: {{ include "xsphere.workloadNamespace" . }}
  labels:
    {{- include "xsphere.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.runtime.warmPoolReplicas }}
  sandboxTemplateRef:
    name: {{ .Values.runtime.templateName }}
  updateStrategy:
    type: Recreate
{{- end }}
